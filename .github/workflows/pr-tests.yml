name: PR Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        # The test project compiles source files directly so no game DLLs are needed.
        run: dotnet restore tests/MyTurnMod.Tests/MyTurnMod.Tests.csproj

      - name: Run Tests
        run: dotnet test tests/MyTurnMod.Tests/MyTurnMod.Tests.csproj --no-restore -c Release --verbosity normal
